<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Chiikawa Collection</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Kiwi+Maru:wght@400;500&family=Noto+Sans+TC:wght@400;500;600&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="site-header">

        <div class="header-decoration decoration-left">✿</div>
        <div class="header-decoration decoration-right">＊</div>

        <p class="eyebrow">OUR LITTLE COLLECTION</p>

        <h1>
            Chiikawa
            <span>Collection</span>
        </h1>

        <p class="subtitle" id="memberNames"></p>

    </header>


    <main>

        <!-- =========================
             收藏統計
        ========================== -->

        <section class="collection-intro">

            <div class="intro-title">
                <span>OUR COLLECTION</span>
                <span class="tiny-line"></span>
            </div>

            <div class="stats">

                <div class="stat">
                    <strong id="owned-count">0</strong>
                    <span>COLLECTED</span>
                </div>

                <div class="stat">
                    <strong id="total-count">0</strong>
                    <span>ITEMS</span>
                </div>

                <div class="stat">
                    <strong id="progress-percent">0%</strong>
                    <span>PROGRESS</span>
                </div>

            </div>

            <div class="progress">
                <div
                    class="progress-bar"
                    id="progress-bar"
                ></div>
            </div>

        </section>


        <!-- =========================
             篩選
        ========================== -->

        <section class="toolbar">

            <div class="toolbar-top">

                <div class="section-label">
                    COLLECTION
                </div>

                <div class="search-box">

                    <span>⌕</span>

                    <input
                        type="text"
                        id="search-input"
                        placeholder="Search collection..."
                    >

                </div>

            </div>


            <!-- 收藏者 -->

            <div class="filter-row">

                <span class="filter-title">
                    OWNER
                </span>

                <div class="filter-buttons">

                    <button
                        class="filter-button active"
                        data-owner="all"
                    >
                        All
                    </button>

                    <button
                        class="filter-button"
                        data-owner="我"
                    >
                        <span class="owner-dot pauline"></span>
                        Pauline
                    </button>

                    <button
                        class="filter-button"
                        data-owner="朋友"
                    >
                        <span class="owner-dot alice"></span>
                        Alice
                    </button>

                    <button
                        class="filter-button"
                        data-owner="both"
                    >
                        Both
                    </button>

                </div>

            </div>


            <!-- 角色 -->

            <div class="filter-row">

                <span class="filter-title">
                    CHARACTER
                </span>

                <div class="filter-buttons">

                    <button
                        class="filter-button active"
                        data-character="all"
                    >
                        All
                    </button>

                    <button
                        class="filter-button"
                        data-character="吉伊"
                    >
                        吉伊
                    </button>

                    <button
                        class="filter-button"
                        data-character="小八"
                    >
                        小八
                    </button>

                    <button
                        class="filter-button"
                        data-character="其他"
                    >
                        其他
                    </button>

                </div>

            </div>

        </section>


        <!-- =========================
             收藏列表
        ========================== -->

        <section class="collection-section">

            <div class="collection-heading">

                <div>
                    <p class="eyebrow">THE LITTLE THINGS</p>
                    <h2>Collection</h2>
                </div>

                <span id="result-count">
                    0 items
                </span>

            </div>


            <div
                class="collection"
                id="collection-list"
            ></div>

        </section>

    </main>


    <footer>

        <span>♡</span>

        made by Pauline

        <span>♡</span>

    </footer>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="script.js"></script>

</body>

</html>
