<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>我們的吉伊卡哇收藏</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>🧸 我們的吉伊卡哇收藏</h1>
        <p>吉伊 × 小八 收藏簿</p>
    </header>

    <main>
        <!-- 收藏總覽 -->
        <section class="overview">

            <h2>🧸 我們的收藏</h2>

            <p id="collection-count">目前共收藏 0 件</p>

            <div class="progress">
                <div class="progress-bar"></div>
            </div>

        </section>


        <!-- 搜尋與篩選 -->
        <section class="filters">

            <h2>🔎 找找看</h2>

            <input
                type="text"
                id="search-input"
                placeholder="搜尋收藏名稱..."
            >

            <div class="filter-group">

                <h3>角色</h3>

                <div class="filter-buttons">

                    <button data-character="all">全部</button>
                    <button data-character="吉伊">吉伊</button>
                    <button data-character="小八">小八</button>
                    <button data-character="其他">其他</button>

                </div>

            </div>


            <div class="filter-group">

                <h3>收藏者</h3>

                <div class="filter-buttons">

                    <button data-owner="all">全部</button>
                    <button data-owner="我">我</button>
                    <button data-owner="朋友">朋友</button>

                </div>

            </div>

        </section>


        <!-- 收藏牆 -->
        <section class="collection-section">

            <h2>✨ 收藏牆</h2>

            <div class="collection" id="collection-list">
     
            </div>

        </section>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>

</body>

</html>
